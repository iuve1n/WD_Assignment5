      <h1>Calculator</h1>
      <div class="calculator-inputs">
        <div>
          <label for="first-number">First number</label>
          <input class="text-input" id="first-number" type="number" step="any">
        </div>
        <div>
          <label for="second-number">Second number</label>
          <input class="text-input" id="second-number" type="number" step="any">
        </div>
      </div>
      <div class="button-row">
        <button id="add" type="button">Add</button>
        <button id="subtract" type="button">Subtract</button>
        <button id="multiply" type="button">Multiply</button>
        <button id="divide" type="button">Divide</button>
      </div>
      <p id="calculation-result" class="note" aria-live="polite">Enter two numbers and choose an operation.</p>
